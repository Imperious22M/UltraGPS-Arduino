[env:uno]
platform = atmelavr
board = uno
framework = arduino
lib_deps = nRF24/RF24
; Radio layer shared with the other station (shared/radio, shared/sysreset)
lib_extra_dirs = ../shared
; Let the shared library see this project's debug_macros.h
build_flags = -I src
monitor_speed = 38400

monitor_port = /dev/ultragps-base
upload_port = /dev/ultragps-base
